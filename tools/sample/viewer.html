<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Body Model — anatomy sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#EDE6DA; --muted:#9FB3B1; --panel:rgba(14,32,36,.94); --line:#2C4A4F; --effort:#FFB547; --pw:340px; --peek:0px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#082226; color:var(--ink); font:15px/1.45 'Atkinson Hyperlegible', system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; left:0; top:0; right:var(--pw); bottom:var(--peek); }
  canvas { display:block; touch-action:none; width:100%; height:100%; }
  button, input { font:inherit; color:var(--ink); }
  button { background:var(--panel); border:1px solid var(--line); border-radius:10px; min-height:36px; padding:0 12px; cursor:pointer; white-space:nowrap; }
  button[aria-pressed="true"] { border-color:var(--ink); background:#1d3d42; }

  button:focus-visible, input:focus-visible { outline:2px solid var(--effort); outline-offset:2px; }
  .top { position:fixed; top:10px; left:10px; right:calc(var(--pw) + 10px); display:flex; gap:6px; align-items:center; z-index:3; overflow-x:auto; scrollbar-width:none; }
  .top::-webkit-scrollbar { display:none; }
  h1 { font:600 22px/1 'Barlow Condensed', sans-serif; margin:0 8px 0 4px; white-space:nowrap; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:none; }
  .seg button { border:0; border-radius:0; min-height:34px; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:var(--pw); background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; z-index:4; backdrop-filter:blur(10px); }
  #panel section { padding:10px 14px; border-bottom:1px solid var(--line); }
  #panel h2 { font:600 18px/1.1 'Barlow Condensed', sans-serif; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #peel { width:100%; accent-color:var(--ink); }
  .ticks { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .now { margin:4px 0 0; font-size:13px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { min-height:32px; font-size:13px; padding:0 10px; }
  .legend { display:none; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend.on { display:flex; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .search { padding:10px 14px 4px; }
  .search input { width:100%; background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; min-height:38px; padding:0 10px; }
  .list { flex:1; overflow-y:auto; padding:0 6px 16px; }
  .reg { font:600 16px/1 'Barlow Condensed', sans-serif; color:var(--muted); margin:14px 8px 4px; }
  .row { display:flex; align-items:center; gap:8px; width:100%; min-height:34px; text-align:left; background:none; border:0; border-radius:8px; padding:2px 8px; font-size:14px; white-space:normal; }
  .row:hover { background:rgba(255,255,255,.05); }
  .row.sel { background:rgba(255,181,71,.16); }
  .row .nm { flex:1; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  #card { position:fixed; left:12px; bottom:calc(var(--peek) + 12px); width:min(440px, calc(100vw - var(--pw) - 24px)); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; z-index:3; }
  #card b { font:600 21px/1.1 'Barlow Condensed', sans-serif; display:block; }
  #card .meta { color:var(--muted); font-size:13px; }
  #card .acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #card .acts button { min-height:32px; font-size:14px; }
  #card:empty { display:none; }
  #labels { position:fixed; left:0; top:0; right:var(--pw); bottom:var(--peek); pointer-events:none; z-index:2; }
  #labels svg { position:absolute; inset:0; width:100%; height:100%; }
  .lab { position:absolute; pointer-events:auto; transform:translateY(-50%); font-size:13px; line-height:1.1; padding:3px 7px; border-radius:6px; background:rgba(8,30,34,.8); border:1px solid var(--line); min-height:0; max-width:190px; overflow:hidden; text-overflow:ellipsis; }
  .lab.r { transform:translate(-100%,-50%); }
  #load { position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); z-index:9; text-align:center; padding:20px; }
  #handle { display:none; }
  .tone { width:26px; height:26px; min-height:26px; padding:0; border-radius:50%; }
  @media (max-width: 760px) {
    :root { --pw:0px; --peek:148px; font-size:14px; }
    h1 { display:none; }
    .top { top:8px; left:8px; right:8px; }
    .top button { min-height:32px; padding:0 10px; font-size:13px; }
    #panel { top:auto; left:0; width:auto; height:var(--peek); border-left:0; border-top:1px solid var(--line); border-radius:16px 16px 0 0; transition:height .22s ease-out; }
    body.open #panel { height:72vh; }
    #handle { display:block; width:100%; min-height:22px; border:0; background:none; padding:6px 0 0; }
    #handle::before { content:''; display:block; width:44px; height:4px; margin:0 auto; border-radius:2px; background:var(--muted); }
    #panel section { padding:6px 12px; }
    body:not(.open) #panel .more { display:none; }
    #card { left:8px; right:8px; width:auto; padding:8px 12px; }
    #card b { font-size:18px; }
    .lab { font-size:12px; max-width:140px; }
  }
  @media (prefers-reduced-motion: reduce) { #panel { transition:none; } }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="load">Loading anatomy…</div>
<div id="stage"></div>
<div class="top">
  <h1>Body sample</h1>
  <div class="seg" role="group" aria-label="Body"><button id="sM" aria-pressed="true">Male</button><button id="sF" aria-pressed="false">Female</button></div>
  <button data-view="front">Front</button>
  <button data-view="side">Side</button>
  <button data-view="back">Back</button>

</div>
<div id="labels"><svg></svg></div>

<aside id="panel" aria-label="Layers and parts">
  <button id="handle" aria-label="Show more controls" aria-expanded="false"></button>
  <section>
    <h2><span>Depth</span><span class="now" id="now"></span></h2>
    <input id="peel" type="range" min="0" max="4" step="1" value="0" aria-label="Depth">
    <div class="ticks" id="ticks"></div>
  </section>
  <section class="more">
    <h2>Show</h2>
    <div class="chips" id="systems"></div>
  </section>
  <section class="more">
    <div class="chips">
      <button id="tLabels" aria-pressed="true">Labels</button>
      <button id="tGhost" aria-pressed="true">Ghost peeled</button>
      <button id="tSee" aria-pressed="false">See-through skin</button>
      <button id="tColour">Colour: natural</button>
      <span style="display:inline-flex;gap:6px;align-items:center" aria-label="Skin tone">
        <button class="tone" data-tone="#e3b796" style="background:#e3b796" aria-label="Light skin tone"></button>
        <button class="tone" data-tone="#b8876a" style="background:#b8876a" aria-label="Medium skin tone"></button>
        <button class="tone" data-tone="#7a5038" style="background:#7a5038" aria-label="Dark skin tone"></button>
      </span>
    </div>
    <div class="legend" id="legend"></div>
  </section>
  <div class="search more"><input id="q" type="search" placeholder="Find a muscle, bone or organ" aria-label="Find a part"></div>

  <div class="list more" id="list"></div>
</aside>
<div id="card"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const stage = $('stage');
const LAYER_COL = ['#888', '#c9483f', '#3f74c9', '#3aa36a', '#c99a2e', '#8a5cc9', '#2fb3b3'];
const layerName = (l) => l === 1 ? 'Superficial' : l === 2 ? 'Intermediate' : l === 3 ? 'Deep' : `Deep ${l - 2}`;
const SYSTEMS = [ // toggle key -> kinds
  ['organs', 'Organs', ['organ']], ['vessels', 'Heart and vessels', ['vessel']], ['nerves', 'Brain and nerves', ['nerve']],
  ['lymph', 'Lymphatic', ['lymph']], ['joints', 'Ligaments and cartilage', ['joint']], ['bones', 'Skeleton', ['bone']],
];
const SYS_COL = { muscle: '#c9483f', tendon: '#e6d8c4', bone: '#e2d6c1', organ: '#d88a5a', vessel: '#3f74c9', nerve: '#e8cf6e', lymph: '#5fae5a', joint: '#9ec6d4', skin: '#b8876a' };

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.sortObjects = true;
stage.append(renderer.domElement);
const scene = new THREE.Scene();
{ const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'), g = x.createRadialGradient(256, 210, 20, 256, 256, 380);
  g.addColorStop(0, '#16555d'); g.addColorStop(1, '#06282c'); x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 0.2; controls.maxDistance = 6;
const key = new THREE.DirectionalLight(0xfff1e0, 2.0); key.position.set(-1.5, 3, 2.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xa8e6ff, 2.2); rim.position.set(1.8, 2.2, -2.5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(2, 0.5, 2); scene.add(fill);
scene.add(new THREE.HemisphereLight(0x9fd6dd, 0x1a0a08, 0.4));
{ const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.002; scene.add(m); }

// ---------- data ----------
async function loadData() {
  const meta = await fetch('body.json').then((r) => r.json());
  const parts = await Promise.all(Array.from({ length: meta.chunks }, (_, i) => fetch(`data${i}.txt`).then((r) => r.text())));
  const s = atob(parts.join('')), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const buf = await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return [meta, buf];
}
let meta, buf;
try { [meta, buf] = await loadData(); }
catch (e) { $('load').textContent = 'This browser could not unpack the anatomy data. Try a current Chrome, Edge, Firefox or Safari.'; throw e; }
const names = meta.names;
const NW = 1 << Math.ceil(Math.log2(names.length + 1));
const stateData = new Uint8Array(NW * 2 * 4);
const stateTex = new THREE.DataTexture(stateData, NW, 2, THREE.RGBAFormat);
stateTex.magFilter = stateTex.minFilter = THREE.NearestFilter;
names.forEach((n, i) => { const c = new THREE.Color(n.colour); const o = (NW + i) * 4; stateData[o] = c.r * 255; stateData[o + 1] = c.g * 255; stateData[o + 2] = c.b * 255; });
const uniforms = { uState: { value: stateTex }, uTime: { value: 0 }, uFibre: { value: 1 }, uColour: { value: 0 }, uGhost: { value: 1 } };

const COMMON = /* glsl */`
varying vec3 vWPos; varying vec3 vFib; varying float vMid; varying float vAo; varying float vAcr;
uniform sampler2D uState; uniform float uTime; uniform float uFibre; uniform float uColour; uniform float uFreq; uniform float uStr;
float h31(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
vec4 partState(){ return texelFetch(uState, ivec2(int(vMid+0.5), 0), 0); }
vec3 partCol(){ return pow(texelFetch(uState, ivec2(int(vMid+0.5), 1), 0).rgb, vec3(2.2)); }
vec3 layerCol(float l){
  return l < 1.5 ? vec3(.79,.28,.25) : l < 2.5 ? vec3(.25,.45,.79) : l < 3.5 ? vec3(.23,.64,.42) : l < 4.5 ? vec3(.79,.6,.18) : l < 5.5 ? vec3(.54,.36,.79) : vec3(.18,.7,.7); }
vec3 gBump; float gShade;
void striate(vec3 Nw){
  vec3 A = vFib - Nw*dot(vFib,Nw); A = length(A) < 1e-4 ? vec3(0,1,0) : normalize(A);
  vec3 U = normalize(cross(A, Nw));
  float along = dot(vWPos, A), across = vAcr;
  float n = vnoise(vec3(across*90., along*4., vMid*1.7));
  float ph = across*uFreq + n*0.55;
  float ph2 = across*uFreq*0.22 + vnoise(vec3(across*20., along*2.5, vMid))*0.9;
  float f1 = clamp(1.-fwidth(ph)*0.8,0.,1.), f2 = clamp(1.-fwidth(ph2)*0.8,0.,1.);
  gBump = U*(cos(ph*6.2831)*f1*uStr*0.7 + cos(ph2*6.2831)*f2*uStr*1.5)*uFibre;
  gShade = 1. + (sin(ph2*6.2831)*0.06*f2 + sin(ph*6.2831)*0.05*f1)*uFibre*step(0.001,uStr);
}`;
const VHEAD = 'attribute vec3 fib; attribute float mid; attribute float ao; attribute float acr;\nvarying vec3 vWPos; varying vec3 vFib; varying float vMid; varying float vAo; varying float vAcr;\n';
const VSET = 'vWPos=(modelMatrix*vec4(position,1.)).xyz; vFib=fib; vMid=mid; vAo=ao; vAcr=acr;';

function tissueMat(params, freq, str, tint, sysCol) {
  const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, ...params });
  mat.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, uniforms, { uFreq: { value: freq }, uStr: { value: str } });
    s.vertexShader = VHEAD + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + VSET);
    s.fragmentShader = s.fragmentShader
      .replace('#include <common>', '#include <common>\n' + COMMON)
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nvec4 st = partState(); if (st.r < 0.5) discard;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        striate(normalize((vec4(vNormal,0.)*viewMatrix).xyz));
        diffuseColor.rgb *= partCol();
        if (uColour > 0.5 && uColour < 1.5 && st.b > 0.) diffuseColor.rgb = layerCol(st.b*255.) * 0.5;
        if (uColour > 1.5) diffuseColor.rgb = pow(vec3(${sysCol}), vec3(2.2)) * 0.8;
        diffuseColor.rgb *= mix(0.32, 1.0, vAo) * gShade * mix(${tint[0].toFixed(2)}, ${tint[1].toFixed(2)}, h31(vec3(vMid,3.,7.)));`)
      .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\nnormal = normalize(normal + (viewMatrix*vec4(gBump,0.)).xyz);')
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= vAo; reflectedLight.indirectSpecular *= vAo*vAo;
        reflectedLight.directSpecular *= mix(0.35, 1.0, vAo); reflectedLight.directDiffuse *= mix(0.55, 1.0, vAo);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        if (st.g > 0.5) totalEmissiveRadiance += vec3(1.0,0.62,0.18) * (0.45 + 0.2*sin(uTime*3.));`);
  };
  return mat;
}
const rgb = (h) => { const c = new THREE.Color(h); return `${c.r.toFixed(3)},${c.g.toFixed(3)},${c.b.toFixed(3)}`; };
const wet = { roughness: 0.42, clearcoat: 0.3, clearcoatRoughness: 0.3, sheen: 0.5, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xd08a80) };
const MATS = {
  muscle: tissueMat({ roughness: 0.5, clearcoat: 0.22, clearcoatRoughness: 0.38, sheen: 0.7, sheenColor: new THREE.Color(0xc8574f), sheenRoughness: 0.5, anisotropy: 0.55, specularIntensity: 0.5 }, 300, 0.13, [0.8, 1.1], rgb(SYS_COL.muscle)),
  tendon: tissueMat({ roughness: 0.32, clearcoat: 0.5, clearcoatRoughness: 0.25, sheen: 0.6, sheenColor: new THREE.Color(0xffe8d6) }, 700, 0.05, [0.95, 1.03], rgb(SYS_COL.tendon)),
  bone: tissueMat({ roughness: 0.7, sheen: 0.3, sheenColor: new THREE.Color(0xfff4e0) }, 300, 0, [0.97, 1.02], rgb(SYS_COL.bone)),
  organ: tissueMat(wet, 300, 0, [0.9, 1.08], rgb(SYS_COL.organ)),
  vessel: tissueMat(wet, 300, 0, [0.95, 1.05], rgb(SYS_COL.vessel)),
  nerve: tissueMat({ ...wet, sheenColor: new THREE.Color(0xfff0c0) }, 300, 0, [0.95, 1.05], rgb(SYS_COL.nerve)),
  lymph: tissueMat(wet, 300, 0, [0.95, 1.05], rgb(SYS_COL.lymph)),
  joint: tissueMat({ roughness: 0.35, clearcoat: 0.4, sheen: 0.4, sheenColor: new THREE.Color(0xeef6ff) }, 300, 0, [0.95, 1.05], rgb(SYS_COL.joint)),
};
// skin: soft, slightly translucent-looking; opacity driven by depth / see-through
const skinMat = new THREE.MeshPhysicalMaterial({ color: 0xb8876a, roughness: 0.55, sheen: 0.8, sheenColor: new THREE.Color(0xff9a7a), sheenRoughness: 0.6,
  specularIntensity: 0.22, clearcoat: 0, transparent: true, opacity: 1 });
skinMat.onBeforeCompile = (s) => {
  s.uniforms.uState = uniforms.uState;
  s.vertexShader = 'attribute float mid; varying float vMid;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvMid = mid;');
  s.fragmentShader = 'uniform sampler2D uState; varying float vMid;\n' + s.fragmentShader.replace('#include <clipping_planes_fragment>',
    '#include <clipping_planes_fragment>\nif (texelFetch(uState, ivec2(int(vMid+0.5),0),0).r < 0.5) discard;');
};
const ghostMat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  vertexShader: VHEAD + 'varying vec3 vN; varying vec3 vV;\nvoid main(){ ' + VSET + ' vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }',
  fragmentShader: 'varying float vMid; varying vec3 vN; varying vec3 vV;\nuniform sampler2D uState; uniform float uGhost;\n' +
    'void main(){ vec4 st = texelFetch(uState, ivec2(int(vMid+0.5),0),0); if (st.r > 0.5 || st.a < 0.5 || uGhost < 0.5) discard;\n' +
    ' float f = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.); gl_FragColor = vec4(vec3(0.75,0.92,0.95), 0.03 + 0.2*f); }',
});
const idMat = new THREE.ShaderMaterial({
  uniforms: { uState: uniforms.uState },
  vertexShader: 'attribute float mid; varying float vMid; void main(){ vMid = mid; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform sampler2D uState; varying float vMid; void main(){ vec4 st = texelFetch(uState, ivec2(int(vMid+0.5),0),0); if (st.r < 0.5) discard;\n float id = vMid + 1.; gl_FragColor = vec4(mod(id,256.)/255., floor(id/256.)/255., 0., 1.); }',
});
idMat.toneMapped = false;

const [lo, hi] = meta.box;
const geos = {}, meshes = {}, ghosts = [];
const posBy = { M: {}, F: {} }, nrmBy = { M: {}, F: {} };
const centre = { M: names.map(() => [0, 0, 0, 0]), F: names.map(() => [0, 0, 0, 0]) };
const ext = { M: names.map(() => [9, 9, 9, -9, -9, -9]), F: names.map(() => [9, 9, 9, -9, -9, -9]) };
for (const [kind, g] of Object.entries(meta.groups)) {
  const v = (k, T, n) => new T(buf, g[k][0], g[k][1] / T.BYTES_PER_ELEMENT);
  const mid16 = v('mid', Uint16Array), mid = Float32Array.from(mid16);
  for (const sx of ['M', 'F']) {
    const q = v('pos' + sx, Uint16Array), p = new Float32Array(q.length);
    for (let i = 0; i < q.length; i += 3) for (let k = 0; k < 3; k++) p[i + k] = lo[k] + (q[i + k] / 65535) * (hi[k] - lo[k]);
    posBy[sx][kind] = p; nrmBy[sx][kind] = new THREE.BufferAttribute(v('nrm' + sx, Int8Array), 3, true);
    for (let i = 0, j = 0; i < p.length; i += 3, j++) {
      const m = mid16[j], c = centre[sx][m], e = ext[sx][m]; c[0] += p[i]; c[1] += p[i + 1]; c[2] += p[i + 2]; c[3]++;

// ---------- controls ----------
const peel = $('peel'); peel.max = maxLayer + 1;

$('systems').innerHTML = SYSTEMS.map(([k, label]) => `<button data-sys="${k}" aria-pressed="${S.sys[k]}">${label}</button>`).join('');

toggle('tSee', (on) => { S.see = on; applyState(); });
const COLOURS = ['natural', 'by layer', 'by system'];
$('tColour').onclick = () => {

  const lg = $('legend'); lg.classList.toggle('on', S.colour > 0);

for (const b of document.querySelectorAll('.tone')) b.onclick = () => skinMat.color.set(b.dataset.tone);
function setSex(sx) {

$('sM').onclick = () => setSex('M'); $('sF').onclick = () => setSex('F');
$('handle').onclick = () => { const o = document.body.classList.toggle('open'); $('handle').setAttribute('aria-expanded', o); };

// ---------- list ----------
const KINDS = [['muscle', 'Muscles'], ['organ', 'Organs'], ['bone', 'Bones'], ['vessel', 'Vessels'], ['nerve', 'Nerves'], ['lymph', 'Lymph'], ['joint', 'Ligaments']];
$('kinds').innerHTML = KINDS.map(([k, l]) => `<button data-kind="${k}" aria-pressed="${k === S.list}">${l}</button>`).join('');
$('kinds').onclick = (e) => { const b = e.target.closest('[data-kind]'); if (!b) return; S.list = b.dataset.kind; for (const x of $('kinds').children) x.setAttribute('aria-pressed', x === b); renderList(); };

$('q').oninput = renderList;
$('list').onclick = (e) => { const b = e.target.closest('.row'); if (b) select(b.dataset.base, { reveal: true, focus: true }); };

// ---------- selection ----------
function select(base, { reveal = false, focus = false } = {}) {

// ---------- id pass: picking + labels ----------

function clearLabels() { svg.innerHTML = ''; $('labels').querySelectorAll('.lab').forEach((e) => e.remove()); }

// ---------- views, sizing ----------
const VIEWS = { front: [0, 0.9], q: [-35, 0.9], side: [-90, 0.9], back: [180, 0.9], backtorso: [180, 1.25, 1.5], close: [-30, 1.32, 1.0], pelvis: [0, 0.95, 0.9] };

}
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view);
function resize() { const w = cw(), h = ch(); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); queueLabels(); }
new ResizeObserver(resize).observe(stage);
resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {

setView('q'); applyState(); renderList();
Object.assign(window, { __setView: setView, __depth: (v) => { peel.value = v; peel.oninput(); }, __select: select, __sex: setSex,

</script>
